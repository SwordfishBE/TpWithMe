plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

if (providers.gradleProperty('testC2me').isPresent() && providers.gradleProperty('testMoonrise').isPresent()) {
    throw new GradleException('C2ME and Moonrise are incompatible; run their compatibility tests separately.')
}
if (providers.gradleProperty('testAsync').isPresent()
        && (providers.gradleProperty('testMoonrise').isPresent() || providers.gradleProperty('testOpac').isPresent())) {
    throw new GradleException('Async is incompatible with Moonrise and OPAC; run these compatibility tests separately.')
}

for (String unavailable : ['testOpac', 'testEssentialCommands', 'testAsync']) {
    if (providers.gradleProperty(unavailable).isPresent()) {
        throw new GradleException("${unavailable} is not available for Minecraft ${project.minecraft_version}; do not load the old 26.3 test binaries.")
    }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        tpwithme {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.shedaniel.me/' }
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'tpwithme-test'
        enableGameTests = true
        enableClientGameTests = project.hasProperty('clientTests')
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Minecraft 26.1+ is non-obfuscated, so Loom uses standard configurations.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    include(implementation("me.lucko:fabric-permissions-api:0.7.0"))
    gametestCompileOnly "maven.modrinth:open-parties-and-claims:KBCCg0os"
    if (providers.gradleProperty('testC2me').isPresent()) {
        gametestRuntimeOnly "maven.modrinth:c2me-fabric:bvOHPArP"
    }
    if (providers.gradleProperty('testMoonrise').isPresent()) {
        gametestRuntimeOnly "maven.modrinth:moonrise-opt:7QHz5gbK"
    }
    if (providers.gradleProperty('testLeashedTeleportJar').isPresent()) {
        gametestRuntimeOnly files(providers.gradleProperty('testLeashedTeleportJar').get())
    }
    clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    clientRuntimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    clientCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }
    if (!project.hasProperty('withoutCloth')) {
        clientRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
            exclude group: "net.fabricmc.fabric-api"
        }
    }
}

if (project.hasProperty('clientTests')) {
    sourceSets.gametest.java.srcDir('src/clientTest/java')
    sourceSets.gametest.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
    sourceSets.gametest.runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
}

tasks.named('processGametestResources') {
    inputs.property('clientTests', project.hasProperty('clientTests'))
    if (project.hasProperty('clientTests')) {
        doLast {
            def metadataFile = new File(destinationDir, 'fabric.mod.json')
            def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
            metadata.environment = '*'
            metadata.entrypoints['fabric-client-gametest'] = ['net.tpwithme.ClothConfigNoticeClientTest']
            metadataFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata))
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// 26.1: use jar instead of remapJar (no remapping needed)
jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
